[package]
name = "sandbox-egress"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Embeddable, run-scoped egress proxy for Rust sandbox supervisors"
documentation = "https://docs.rs/sandbox-egress"
repository = "https://github.com/bryanhelmig/sandbox-egress"
license = "MIT"
readme = "README.md"
keywords = ["sandbox", "egress", "proxy", "ssrf", "microvm"]
categories = ["network-programming", "virtualization"]
include = [
    "src/**",
    "tests/**",
    "benches/**",
    "examples/**",
    "docs/**",
    "scripts/**",
    ".cargo/**",
    ".dockerignore",
    "Cargo.toml",
    "Cargo.lock",
    "Dockerfile",
    "Dockerfile.host-boundary",
    "deny.toml",
    "rust-toolchain.toml",
    "README.md",
    "AGENTS.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "LICENSE-MIT",
]

[dependencies]
hickory-resolver = { version = "0.26.1", default-features = false, features = ["system-config", "tokio"] }
http = "1.3"
httparse = "1.10.1"
ipnet = "2.11"
rustls = { version = "0.23.43", default-features = false, features = ["std", "tls12"] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["io-util", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["rt"] }

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }
socket2 = "0.6"

[[bench]]
name = "lifecycle"
harness = false

[[bench]]
name = "connections"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
